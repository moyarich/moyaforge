name: CI / npm package lint
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/ci_npm-package-lint.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/ci_npm-package-lint.yml"
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Show workflow input parameters
        type: boolean
        default: true
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "Workflow inputs"

  npm-package-lint:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_ci_npm-package-lint.yml@main
    with:
      checkout-sha: ${{ inputs.checkout-sha }}
      expected-author: "Moya Richards"

  package-exports:
    name: Verify published files and TypeScript exports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Build workspaces
        run: npm run build
      - name: Verify npm tarball contents
        run: npm run pack:verify
