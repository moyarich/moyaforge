name: Temporary / Storybook lockfile regeneration
on:
  push:
    branches:
      - feat/mdx-code-preview-playground
    paths:
      - "packages/moyaforge-ui/package.json"
      - ".github/workflows/temporary-storybook-lock.yml"
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Regenerate the npm lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v6
        with:
          name: storybook-upgraded-package-lock
          path: package-lock.json
