name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  deduplicate:
    name: Select CI trigger
    runs-on: ubuntu-latest
    outputs:
      run-checks: ${{ steps.check.outputs.run-checks }}
    steps:
      - name: Skip branch push checks when an open PR handles the same commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != push || "$REF_NAME" == main ]]; then
            echo "run-checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_prs=$(gh api --method GET "repos/$REPO/pulls" \
            -f state=open -f head="$OWNER:$REF_NAME" --jq 'length')
          if [[ "$open_prs" -gt 0 ]]; then
            echo "run-checks=false" >> "$GITHUB_OUTPUT"
            echo "Open PR detected: use pull_request CI for this branch."
          else
            echo "run-checks=true" >> "$GITHUB_OUTPUT"
          fi

  playground:
    needs: deduplicate
    if: needs.deduplicate.outputs.run-checks == 'true'
    name: Validate workspace and playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Validate canonical component registry on main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npm run registry:check
      - name: Install Playwright Chromium on main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npx playwright install --with-deps chromium
      - name: Test all workspaces
        env:
          MOYAFORGE_REGISTRY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm test --workspaces --if-present
      - name: Validate registered content links and anchors
        run: npm run check:links
      - run: npm run build --workspaces
      - name: Verify moyaforge-mdx publish tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack --workspace @moyarich/moyaforge-mdx --dry-run --json > /tmp/moyaforge-mdx-pack.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('/tmp/moyaforge-mdx-pack.json', 'utf8'));
          const pkg = Array.isArray(result) ? result[0] : Object.values(result)[0];
          if (pkg.name !== '@moyarich/moyaforge-mdx') throw Error('Unexpected tarball package');
          const files = new Set(pkg.files.map(({ path }) => path));
          for (const file of [
            'dist/index.js', 'dist/index.d.ts',
            'dist/vite/plugin.js', 'dist/vite/plugin.d.ts',
            'dist/navigation/toc.js', 'dist/navigation/toc.d.ts',
            'dist/content/source-files.js', 'dist/content/source-files.d.ts',
            'README.md', 'CHANGELOG.md', 'package.json',
          ]) {
            if (!files.has(file)) throw Error('Publish tarball missing ' + file);
          }
          console.log('Validated published MDX entry points and documentation.');
          NODE
      - name: Verify playground consumes moyaforge-mdx
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const packageJson = JSON.parse(readFileSync('apps/playground/package.json', 'utf8'));
          if (!packageJson.dependencies?.['@moyarich/moyaforge-mdx']) {
            throw Error('Playground must depend on @moyarich/moyaforge-mdx');
          }
          const vite = readFileSync('apps/playground/vite.config.js', 'utf8');
          const app = readFileSync('apps/playground/src/App.jsx', 'utf8');
          if (!vite.includes('mdxRegistryPlugin(')) throw Error('Playground must use shared MDX Vite plugin');
          const adapter = readFileSync('packages/moyaforge/src/registry-routes.tsx', 'utf8');
          if (!app.includes('virtual:moyaforge-mdx/metadata') ||
              !app.includes('@moyarich/moyaforge/registry-routes') ||
              !app.includes('<RegistryRoutes') ||
              !adapter.includes('virtual:moyaforge-mdx/lazy-registry')) {
            throw Error('Playground must use shared metadata through public RegistryRoutes');
          }
          console.log('Verified playground uses MDX package APIs.');
          NODE
      - name: Build standalone Vite consumer on main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npm run test:consumer:browser
      - name: Run end-to-end browser tests on main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npm run test:e2e
      - name: Validate shadcn registry compatibility
        run: npx --yes shadcn@4.21.5 registry validate ./registry.json
      - name: Check Pages output
        run: test -s apps/playground/dist/index.html
