name: Playground navigation

on:
  pull_request:
    paths:
      - "apps/playground/**"
      - "packages/moyaforge*/**"
      - "docs/**"
      - "tests/playground-navigation/**"
      - "playwright.playground.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playground-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playground:navigation
