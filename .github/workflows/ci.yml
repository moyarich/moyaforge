name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    name: MoyaForge package
    uses: moyarich/reusable-workflows/.github/workflows/reusable_node-ci.yml@main
    with:
      package-directory: packages/moyaforge
      node-version: "24"

  playground:
    name: Build private playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Test all workspaces
        run: npm test --workspaces --if-present
      - name: Validate registered content links and anchors
        run: npm run check:links
      - run: npm run build --workspaces
      - name: Test public consumer package imports
        run: npm run test:consumer
      - name: Build standalone Vite consumer
        run: npm run test:consumer:browser
      - name: Run unit tests with Vitest
        run: npm run test:unit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end browser tests
        run: npm run test:e2e
      - name: Check workspace boundaries and public export targets
        run: npm run test:boundaries
      - name: Check Pages output
        run: test -s apps/playground/dist/index.html
