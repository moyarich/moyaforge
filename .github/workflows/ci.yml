name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    name: MoyaForge package
    uses: moyarich/reusable-workflows/.github/workflows/reusable_node-ci.yml@main
    with:
      package-directory: packages/moyaforge
      node-version: "24"

  playground:
    name: Build private playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Test shared MDX tooling
        run: npm test --workspace @moyarich/moyaforge-mdx
      - name: Test shared SQLite search
        run: npm test --workspace @moyarich/moyaforge-search-sqlite
      - name: Test playground routing and integration
        run: npm test --workspace @moyarich/moyaforge-playground
      - name: Validate registered content links and anchors
        run: npm run check:links
      - run: npm run build --workspace @moyarich/moyaforge-playground
      - name: Test public consumer package imports
        run: npm run test:consumer
      - name: Check workspace boundaries and public export targets
        run: npm run test:boundaries
      - name: Check Pages output
        run: test -s apps/playground/dist/index.html
