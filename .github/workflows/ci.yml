name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  deduplicate:
    name: Select CI trigger
    runs-on: ubuntu-latest
    outputs:
      run-checks: ${{ steps.check.outputs.run-checks }}
    steps:
      - name: Skip branch push checks when an open PR handles the same commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != push || "$REF_NAME" == main ]]; then
            echo "run-checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_prs=$(gh api --method GET "repos/$REPO/pulls" \
            -f state=open -f head="$OWNER:$REF_NAME" --jq 'length')
          if [[ "$open_prs" -gt 0 ]]; then
            echo "run-checks=false" >> "$GITHUB_OUTPUT"
            echo "Open PR detected: use pull_request CI for this branch."
          else
            echo "run-checks=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: deduplicate
    if: needs.deduplicate.outputs.run-checks == 'true'
    name: MoyaForge package
    uses: moyarich/reusable-workflows/.github/workflows/reusable_node-ci.yml@main
    with:
      package-directory: packages/moyaforge
      node-version: "24"

  playground:
    needs: deduplicate
    if: needs.deduplicate.outputs.run-checks == 'true'
    name: Build private playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Test all workspaces
        run: npm test --workspaces --if-present
      - name: Validate registered content links and anchors
        run: npm run check:links
      - run: npm run build --workspaces
      - name: Build standalone Vite consumer
        run: npm run test:consumer:browser
      - name: Run unit tests with Vitest
        run: npm run test:unit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end browser tests
        run: npm run test:e2e
      - name: Check Pages output
        run: test -s apps/playground/dist/index.html
