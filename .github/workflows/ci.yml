name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  package:
    name: Typecheck, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Typecheck package
        run: npm run typecheck --workspace @moyarich/moyaforge
      - name: Run package tests
        run: npm test --workspace @moyarich/moyaforge
      - name: Inspect npm distribution
        run: npm pack --dry-run --workspace @moyarich/moyaforge
