name: Upgrade workspace dependencies
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - name: Upgrade registry dependencies in root and all workspaces
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm exec --yes --package npm-check-updates@latest -- npm-check-updates \
            --upgrade --workspaces --root --dep prod,dev,optional,peer \
            --reject '@moyarich/moyaforge,@moyarich/moyaforge-mdx,@moyarich/moyaforge-search-sqlite,@moyarich/colorshower'
      - name: Preserve supported peer compatibility
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const [file, peers] of Object.entries({
            'packages/moyaforge-mdx/package.json': { vite: '^6.4.0 || ^7.0.0 || ^8.0.0' },
            'packages/moyaforge-search-sqlite/package.json': { vite: '^6.4.0 || ^7.0.0 || ^8.0.0' },
            'packages/moyaforge/package.json': { react: '>=18', 'react-dom': '>=18' }
          })) {
            const manifest = JSON.parse(readFileSync(file, 'utf8'));
            Object.assign(manifest.peerDependencies, peers);
            writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          }
          NODE
      - name: Update lockfile and verify clean installation
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit upgraded manifests and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json packages/*/package.json apps/*/package.json
          if git diff --cached --quiet; then
            echo "Dependencies are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: upgrade all workspace dependencies and peers"
          for attempt in 1 2 3; do
            git fetch --no-tags origin "refs/heads/${{ github.ref_name }}"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Upgrades conflict with newer commits; rerun on the latest branch."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/${{ github.ref_name }}"; then
              exit 0
            fi
          done
          echo "::error::Could not push upgrade after three attempts."
          exit 1
