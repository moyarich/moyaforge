name: CI / Node.js compatibility
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_node-compatibility.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_node-compatibility.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-compatibility:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Build packages
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Verify published package contents
        run: npm run pack:audit:strict
