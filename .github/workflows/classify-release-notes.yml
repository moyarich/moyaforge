name: Classify release notes

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  issues: write

jobs:
  classify:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_classify-release-notes.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      exclude-label: skip-changelog
      public-source-pattern: '^packages/[^/]+/(src|vite-plugin|bin)/'
